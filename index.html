  <!-- ⚠ 192 px POUR UN EMPLACEMENT QUI EN DEMANDE 304 À 334 (07/10/2026,
       signalé par Élodie : l’icône du raccourci de sa tablette est floue).
       Une icône d’accueil fait 152 pt sur iPad et 167 pt sur iPad Pro, sur un
       écran à double densité : le fichier était agrandi d’une fois et demie.
       On sert le 512, qu’iOS réduit lui-même.
       ⚠ ET IL EST OPAQUE ET CARRÉ, pas rond : iOS remplit de NOIR tout pixel
       transparent avant d’appliquer son propre masque — les coins arrondis du
       fichier faisaient donc un liseré noir dans l’arrondi du système. -->
  <link rel="apple-touch-icon" href="assets/icon-apple-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CRM Groupe">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/app.css">
  <!-- Le téléphone : barre de navigation du bas (27/10/2026). Fichier à part
       plutôt qu'un ajout à app.css, que d'autres écrans retouchent souvent. -->
  <link rel="stylesheet" href="css/mobile.css">
  <!-- ⚠ CHART.JS N'EST PLUS ICI (05/11/2026). Il était chargé en script
       bloquant à chaque ouverture — 201 Ko, 68 Ko compressés, avant le premier
       pixel — pour TROIS écrans : le tableau de bord du groupe, l'accueil et le
       Patrimoine. Les graphiques de RGD et de BTP sont dessinés à la main en SVG
       et n'en ont jamais eu besoin. Il est désormais demandé par `js/chart.js`,
       au moment où l'un de ces trois écrans s'ouvre. -->
  <!-- ⚠ SUPABASE EST LOGÉ ICI DEPUIS LE 07/10/2026, ET C'EST UNE PANNE DE
       PRODUCTION QUI L'A IMPOSÉ. Il était chargé depuis esm.sh au démarrage :
       le jour où ce CDN a publié une version cassée, le CRM entier a cessé de
       s'ouvrir, et nous n'avions aucun moyen d'agir. Épingler la version
       protégeait d'une mauvaise publication, pas d'une panne de leur serveur.
       Même traitement que Chart.js au-dessus : le fichier est à nous.
       ⚠ IL EST REPRIS DE npm À L'OCTET PRÈS (@supabase/supabase-js 2.117.0,
       dist/umd, MIT, md5 40a0691b0f7596f780e708b869004391). Ne pas le
       retoucher : son empreinte est ce qui prouve d'où il vient. Pour monter
       de version, on redépose le fichier, on ne l'édite pas.
       ⚠ `defer` DEPUIS LE 05/11/2026, ET L'ORDRE TIENT TOUJOURS. Sans lui, ce
       script bloquait l'analyse du document le temps de ses 213 Ko. Un script
       `defer` et un module attendent la MÊME file, exécutée dans l'ordre du
       document : ce fichier passe donc encore avant `js/app.js`, et `db.js`
       continue de compter sur `window.supabase` sans rien attendre.
       ⚠ NE PAS LUI METTRE `async` À LA PLACE : `async` ne garde aucun ordre,
       et le CRM s'ouvrirait une fois sur deux sans sa base. -->
  <script defer src="assets/supabase.umd.js"></script>
</head>
<body>
  <div id="app"><div class="login"><div class="card"><p class="muted">Chargement…</p></div></div></div>
  <script type="module" src="js/app.js"></script>
</body>
