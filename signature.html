<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Cahier des charges — RGD Renova</title>
  <link rel="icon" href="assets/icon-rgd-192.png" type="image/png">
  <!-- La page PUBLIQUE où un client signe son cahier des charges à distance
       (11/11/2026). Elle ne charge RIEN du CRM : ni session, ni base, ni
       feuille de style de l'application. Elle ne parle qu'à l'Edge Function
       `cahier-signature`, avec le jeton du lien. Voir js/signature-cahier.js. -->
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baguet+Script&family=EB+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --orange: #FC5D00; --encre: #1A1714; --gris: #6E6760; --filet: #E4DFDA; --fond: #F6F3F0; --vert: #15803d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fond); color: var(--encre);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 18px 16px 48px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-bottom: 12px; border-bottom: 3px solid var(--orange); }
    header img { width: 170px; height: auto; }
    header span { font-size: 13px; color: var(--gris); text-align: right; }
    h1 { font-size: 24px; margin: 20px 0 4px; letter-spacing: -.01em; }
    .sous { margin: 0 0 16px; color: var(--gris); }
    .carte { background: #fff; border: 1px solid var(--filet); border-radius: 14px; padding: 16px 18px; margin: 14px 0; }
    .infos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 18px; }
    .infos div span { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); }
    .infos div b { font-weight: 600; }
    .infos .large { grid-column: 1 / -1; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; margin: 0 0 8px; padding-left: 9px; border-left: 4px solid var(--orange); }
    h1 { font-family: 'EB Garamond', Garamond, Georgia, serif; font-weight: 400; font-size: 32px; }
    h2.manuscrit { font-family: 'Baguet Script', 'Brush Script MT', cursive; font-weight: 400; font-size: 34px; color: #E48312;
      text-transform: none; letter-spacing: 0; border: 0; padding: 0; margin: 0 0 6px; line-height: 1.2; }
    .piece .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 12px; }
    .piece .photos img { width: 100%; height: 230px; object-fit: cover; display: block;
      clip-path: polygon(0 0, calc(100% - 28px) 0, 100% 28px, 100% 100%, 28px 100%, 0 calc(100% - 28px)); }
    img.plan { width: 100%; height: auto; display: block; border-radius: 8px; }
    .lot { margin: 14px 0 4px; font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: #c2410c; }
    .poste { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--filet); }
    .poste:last-child { border-bottom: 0; }
    .poste div { flex: 1; min-width: 0; }
    .poste small { display: block; color: var(--gris); font-size: 13.5px; white-space: pre-wrap; margin-top: 2px; }
    .poste em { font-style: normal; color: var(--gris); white-space: nowrap; font-size: 14.5px; }
    .texte { white-space: pre-wrap; margin: 0; }
    .accord p { margin: 0 0 12px; }
    label.case { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; cursor: pointer; margin: 4px 0 14px; }
    label.case input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--orange); flex: none; }
    .champ { display: block; margin-bottom: 12px; }
    .champ span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .champ input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #cfc8c1; border-radius: 10px; }
    canvas { display: block; width: 100%; height: 200px; border: 1.5px dashed #b9b0a7; border-radius: 12px; background: #fff;
      touch-action: none; cursor: crosshair; }
    .aide { font-size: 13px; color: var(--gris); margin: 6px 0 14px; }
    .boutons { display: flex; gap: 10px; flex-wrap: wrap; }
    button { font: inherit; font-weight: 700; border-radius: 10px; padding: 12px 18px; cursor: pointer; border: 1.5px solid var(--encre);
      background: #fff; color: var(--encre); }
    button.principal { background: var(--orange); border-color: var(--orange); color: #fff; flex: 1; }
    button:disabled { opacity: .45; cursor: default; }
    .message { padding: 12px 14px; border-radius: 10px; margin: 12px 0; }
    .message.erreur { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .signe { border-color: var(--vert); }
    .signe .titre { color: var(--vert); font-weight: 800; font-size: 18px; margin: 0 0 6px; }
    .signe img { max-width: 260px; max-height: 110px; display: block; margin: 10px 0 4px; }
    .vide { text-align: center; color: var(--gris); padding: 40px 0; }
    footer { margin-top: 24px; font-size: 12.5px; color: var(--gris); text-align: center; }
    @media (max-width: 560px) { .infos { grid-template-columns: 1fr; } h1 { font-size: 21px; } header img { width: 140px; } }
    @media print {
      body { background: #fff; font-size: 11pt; } main { padding: 0; max-width: none; }
      .carte { border: 0; padding: 6px 0; margin: 6px 0; break-inside: avoid; }
      .imprimer, .boutons, footer { display: none !important; }
      @page { size: A4; margin: 14mm; }
    }
  </style>
</head>
<body>
  <main id="page"><p class="vide">Chargement de votre cahier des charges…</p></main>
  <script type="module" src="js/signature-cahier.js"></script>
</body>
</html>
